[project]
name = "rag-leis"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "beautifulsoup4",
    "lxml",
    "numpy",
    "faiss-cpu",
    "sentence-transformers",
    "rank-bm25",
]

[project.optional-dependencies]
dev = ["ruff==0.16.10", "black==26.10.0", "pytest"]
app = ["streamlit"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
