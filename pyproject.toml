[project]
name = "rag-leis"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["requests", "beautifulsoup4", "lxml"]

[project.optional-dependencies]
dev = ["ruff", "black", "pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
